<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spam Avenger for Outlook</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="analyze.js"></script>
  <script src="demand.js"></script>
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <header class="sf-head">
    <img src="icon128.png" alt="Spam Avenger shield" width="34" height="34" />
    <div>
      <div class="sf-title">Spam Avenger</div>
      <div class="sf-tag">Just click, review, send. &middot; v1.1.0</div>
    </div>
  </header>

  <div id="no-office" class="note" hidden>
    <p><strong>This page needs to be opened inside Outlook.</strong></p>
    <p>Open Outlook, open any email, and click the <strong>Spam Avenger</strong>
       button on the message. In a plain web browser there is no email for
       it to work on.</p>
  </div>

  <main id="app" hidden>
    <div id="panel-body" class="sf-body"></div>
  </main>

  <script src="taskpane.js"></script>
